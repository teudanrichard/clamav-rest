name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  # Preserve main and release runs: only superseded pull-request validation is disposable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: rtlabsio/clamav-rest
  IMAGE_SUBJECT: docker.io/rtlabsio/clamav-rest

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan complete Git history for secrets
        run: |
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --no-banner --redact --log-opts=--all

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip-audit --requirement requirements.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -W error
      - name: Validate deployment manifests
        run: |
          docker compose config --quiet
          helm lint charts/clamav-rest
          helm template clamr charts/clamav-rest > /dev/null
          helm template clamr charts/clamav-rest --set oidc.enabled=true --set oidc.issuerUrl=https://id.example/realms/clamr --set oidc.audience=clamr-api --set oidc.requiredScopes=scan --set ingress.enabled=true --set gateway.enabled=true --set serviceMonitor.enabled=true --set networkPolicy.enabled=true > /dev/null
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  integration:
    runs-on: ubuntu-24.04
    services:
      clamav:
        image: clamav/clamav@sha256:d06c1d6a451d616e1dd79b42f44c8c8c291bba9cf4e75ebc4d0e43c1c6dd87bb
        ports:
          - 3310:3310
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Wait for ClamAV
        env:
          CLAMR_BACKEND_HOST: 127.0.0.1
          CLAMR_BACKEND_PORT: "3310"
        run: |
          for _ in $(seq 1 90); do
            python -c 'import asyncio; from app.config import Settings; from app.socket_client import BackendSocketClient; print(asyncio.run(BackendSocketClient(Settings()).ping()))' && break
            sleep 2
          done
      - env:
          RUN_CLAMAV_INTEGRATION: "1"
          CLAMR_BACKEND_HOST: 127.0.0.1
          CLAMR_BACKEND_PORT: "3310"
        run: pytest tests/test_integration.py

  image-build:
    needs: [quality, integration]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image
        if: github.ref == 'refs/heads/main'
        run: |
          docker build --pull --build-arg VCS_REF="$GITHUB_SHA" --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" --build-arg APP_VERSION="$(cat VERSION)" --tag "$IMAGE_NAME:$GITHUB_SHA" .
          docker run --rm "$IMAGE_NAME:$GITHUB_SHA" python -c 'from app.main import app; assert app.title'
      - name: Load main commit image for release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker pull "$IMAGE_NAME:$GITHUB_SHA"
          docker run --rm "$IMAGE_NAME:$GITHUB_SHA" python -c 'from app.main import app; assert app.title'
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_NAME:$GITHUB_SHA")" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE_NAME:$GITHUB_SHA")" = "$(cat VERSION)"
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json
          scanners: vuln
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 30
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
      - name: Export validated image
        run: docker save "$IMAGE_NAME:$GITHUB_SHA" | gzip > image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ github.sha }}
          path: image.tar.gz
          retention-days: 1

  image-publish:
    needs: image-build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: image-${{ github.sha }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: sbom-${{ github.sha }}
      - run: gunzip --stdout image.tar.gz | docker load
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: rtlabsio
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish immutable commit image
        id: publish
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            docker push "$IMAGE_NAME:$GITHUB_SHA"
          fi
          digest="$(docker buildx imagetools inspect "$IMAGE_NAME:$GITHUB_SHA" --format '{{ .Manifest.Digest }}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Publish SemVer images
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          digest="${{ steps.publish.outputs.digest }}"
          for tag in "$version" "$GITHUB_REF_NAME"; do
            target="$IMAGE_NAME:$tag"
            if existing="$(docker buildx imagetools inspect "$target" --format '{{ .Manifest.Digest }}' 2>/dev/null)"; then
              test "$existing" = "$digest"
              echo "$target already resolves to the release digest"
            else
              docker tag "$IMAGE_NAME:$GITHUB_SHA" "$target"
              docker push "$target"
            fi
          done
      - name: Attest release provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_SUBJECT }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Attest release SBOM
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_SUBJECT }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

  chart:
    needs: [quality, integration]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Package chart
        run: helm package charts/clamav-rest --version "${GITHUB_REF_NAME#v}" --app-version "$(cat VERSION)" --destination dist
      - name: Publish chart to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push dist/clamav-rest-*.tgz oci://ghcr.io/teudanrichard/charts

  release:
    needs: [image-publish, chart]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: rtlabsio
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Sign release images
        env:
          IMAGE_DIGEST: ${{ needs.image-publish.outputs.digest }}
        run: cosign sign --yes "$IMAGE_SUBJECT@$IMAGE_DIGEST"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Release $GITHUB_REF_NAME"
