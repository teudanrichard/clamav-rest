name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

env:
  IMAGE_NAME: rtlabsio/clamav-rest

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: azure/setup-helm@v4
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip-audit --requirement requirements.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -W error
      - name: Validate deployment manifests
        run: |
          docker compose config --quiet
          helm lint charts/clamav-rest
          helm template clamr charts/clamav-rest > /dev/null
          helm template clamr charts/clamav-rest --set oidc.enabled=true --set oidc.issuerUrl=https://id.example/realms/clamr --set oidc.audience=clamr-api --set oidc.requiredScopes=scan --set ingress.enabled=true --set gateway.enabled=true --set serviceMonitor.enabled=true --set networkPolicy.enabled=true > /dev/null
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"

  integration:
    runs-on: ubuntu-24.04
    services:
      clamav:
        image: clamav/clamav@sha256:d06c1d6a451d616e1dd79b42f44c8c8c291bba9cf4e75ebc4d0e43c1c6dd87bb
        ports:
          - 3310:3310
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - name: Wait for ClamAV
        env:
          CLAMR_BACKEND_HOST: 127.0.0.1
          CLAMR_BACKEND_PORT: "3310"
        run: |
          for attempt in $(seq 1 90); do
            python -c 'import asyncio; from app.config import Settings; from app.socket_client import BackendSocketClient; print(asyncio.run(BackendSocketClient(Settings()).ping()))' && break
            sleep 2
          done
      - env:
          RUN_CLAMAV_INTEGRATION: "1"
          CLAMR_BACKEND_HOST: 127.0.0.1
          CLAMR_BACKEND_PORT: "3310"
        run: pytest tests/test_integration.py

  dockerhub-docs:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Publish Docker Hub description
        env:
          DOCKERHUB_USERNAME: rtlabsio
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          auth_response="$(curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --data "$(jq -n --arg username "$DOCKERHUB_USERNAME" --arg password "$DOCKERHUB_TOKEN" '{username: $username, password: $password}')" \
            https://hub.docker.com/v2/users/login/)"
          jwt="$(jq -er '.token' <<<"$auth_response")"
          jq -n --rawfile description DOCKERHUB_README.md '{full_description: $description}' > /tmp/dockerhub-description.json
          curl --fail --silent --show-error --request PATCH \
            --header "Authorization: JWT $jwt" \
            --header 'Content-Type: application/json' \
            --data @/tmp/dockerhub-description.json \
            https://hub.docker.com/v2/repositories/rtlabsio/clamav-rest/

  image:
    needs: [quality, integration]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: rtlabsio
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image
        run: |
          docker build --pull --build-arg VCS_REF="$GITHUB_SHA" --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" --build-arg APP_VERSION="$(cat VERSION)" --tag "$IMAGE_NAME:$GITHUB_SHA" .
          docker run --rm "$IMAGE_NAME:$GITHUB_SHA" python -c 'from app.main import app; assert app.title'
      - name: Publish commit image
        run: docker push "$IMAGE_NAME:$GITHUB_SHA"
      - name: Publish SemVer images
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$IMAGE_NAME:$version"
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$IMAGE_NAME:$GITHUB_REF_NAME"
          docker push "$IMAGE_NAME:$version"
          docker push "$IMAGE_NAME:$GITHUB_REF_NAME"
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json
          scanners: vuln
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
      - name: Scan image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

  chart:
    needs: [quality, integration]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package chart
        run: helm package charts/clamav-rest --version "${GITHUB_REF_NAME#v}" --app-version "$(cat VERSION)" --destination dist
      - name: Publish chart to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push dist/clamav-rest-*.tgz oci://ghcr.io/teudanrichard/charts

  release:
    needs: [image, chart]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          username: rtlabsio
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Sign release images
        run: |
          cosign sign --yes "$IMAGE_NAME:${GITHUB_REF_NAME#v}"
          cosign sign --yes "$IMAGE_NAME:$GITHUB_REF_NAME"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Release $GITHUB_REF_NAME"
