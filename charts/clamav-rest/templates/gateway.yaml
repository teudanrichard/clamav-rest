{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "clamav-rest.fullname" . }}
  labels:
    {{- include "clamav-rest.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}annotations: {{ toYaml . | nindent 4 }}{{ end }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  listeners: {{- toYaml .Values.gateway.listeners | nindent 4 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "clamav-rest.fullname" . }}
  labels:
    {{- include "clamav-rest.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "clamav-rest.fullname" . }}
  rules:
    - backendRefs:
        - name: {{ include "clamav-rest.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
